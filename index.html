<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlackberryG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#120a1c;--bg2:#1b1029;--card:#241538;--line:#3a2557;--ink:#f1e9fb;--mute:#a995c4;--accent:#9b5de5;--accent2:#c77dff;--berry:#5a189a;--danger:#ff5d8f}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2,h3,.logo{font-family:'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:-.02em}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.orb{position:fixed;border-radius:50%;filter:blur(90px);z-index:-1;opacity:.45;animation:drift 18s ease-in-out infinite alternate}
.o1{width:480px;height:480px;background:var(--berry);top:-120px;left:-100px}
.o2{width:380px;height:380px;background:#7b2cbf;bottom:-100px;right:-80px;animation-delay:-8s}
@keyframes drift{to{transform:translate(60px,50px) scale(1.15)}}
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:20px;padding:12px 28px;background:rgba(18,10,28,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-size:1.35rem;font-weight:800}
.logo .i{color:var(--accent2);transition:transform .5s}.logo:hover .i{transform:rotate(180deg) scale(1.15)}
nav{display:flex;gap:4px}
nav a{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;color:var(--mute);font-weight:500;transition:.2s}
nav a:hover{color:var(--ink);background:var(--card)}nav a.on{color:#fff;background:var(--berry)}
.sp{flex:1}
.search{position:relative;width:min(300px,34vw)}
.search input{width:100%;padding:9px 12px 9px 38px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;outline:0;transition:.25s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(155,93,229,.2)}
.search>.i{position:absolute;left:12px;top:11px;color:var(--mute)}
.results{position:absolute;top:46px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none;box-shadow:0 20px 50px #000a}
.results.show{display:block;animation:pop .2s}
.results a{display:flex;gap:10px;align-items:center;padding:10px 14px}.results a:hover{background:var(--berry)}
.results small{color:var(--mute);margin-left:auto}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--berry));color:#fff;font-weight:600;cursor:pointer;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(155,93,229,.45)}
.btn.ghost{background:var(--card);border:1px solid var(--line)}.btn.sm{padding:6px 12px;font-size:.9rem}.btn.red{background:#5b1a35}
.prof{position:relative}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--berry));display:grid;place-items:center;font-weight:700;cursor:pointer;border:2px solid var(--line);transition:.2s;overflow:hidden}
.avatar:hover{border-color:var(--accent2);transform:scale(1.07)}.avatar img{width:100%;height:100%;object-fit:cover}
.menu{position:absolute;right:0;top:50px;width:240px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:none;box-shadow:0 20px 50px #000a}
.menu.show{display:block;animation:pop .2s}
.menu b{display:block}.menu small{color:var(--mute);word-break:break-all}
.tag{display:inline-block;margin:8px 0;padding:2px 10px;border-radius:99px;background:var(--accent);font-size:.78rem;font-weight:600}
main{max-width:1180px;margin:0 auto;padding:36px 24px 80px}
.view{animation:enter .45s ease both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}}
.hero{padding:70px 0 50px}
.hero h1{font-size:clamp(3rem,9vw,6.5rem);line-height:.95;font-weight:800;background:linear-gradient(120deg,#fff 20%,var(--accent2) 60%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200%;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% 0}}
.hero p{color:var(--mute);max-width:520px;margin:18px 0 26px;font-size:1.1rem}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
h2{font-size:1.7rem;margin:42px 0 16px;display:flex;align-items:center;gap:10px}
h2 .i{color:var(--accent2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s;cursor:pointer;position:relative}
.card:hover{transform:translateY(-6px);border-color:var(--accent);box-shadow:0 14px 34px rgba(90,24,154,.5)}
.thumb{aspect-ratio:16/10;background:linear-gradient(135deg,var(--berry),#2a1145);display:grid;place-items:center;font:800 3rem 'Bricolage Grotesque';color:var(--accent2);background-size:cover;background-position:center;position:relative}
.thumb .play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(18,10,28,.6);opacity:0;transition:.25s}
.card:hover .play{opacity:1}.play .i{width:42px;height:42px;color:#fff}
.card .t{padding:12px 14px}.card .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card small{color:var(--mute)}
.x{position:absolute;top:8px;right:8px;z-index:2;width:30px;height:30px;border-radius:8px;border:0;background:#5b1a35;cursor:pointer;display:grid;place-items:center}
.letters{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 24px;position:sticky;top:66px;z-index:5;padding:8px 0;background:var(--bg)}
.letters a{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:var(--card);color:var(--mute);font-weight:600;transition:.2s}
.letters a:hover{background:var(--accent);color:#fff;transform:translateY(-3px)}
.letter{font:800 2rem 'Bricolage Grotesque';color:var(--accent2);margin:26px 0 12px;scroll-margin-top:120px}
.player{background:#000;border:1px solid var(--line);border-radius:16px;overflow:hidden;aspect-ratio:16/9;max-height:76vh;width:100%}
.player iframe{width:100%;height:100%;border:0;display:block}
.bar{display:flex;gap:10px;align-items:center;margin:14px 0}.bar h1{font-size:1.8rem;margin-right:auto}
.ann{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;padding:18px 20px;margin-bottom:14px;position:relative;animation:enter .4s both}
.ann h3{margin-bottom:4px}.ann small{color:var(--mute)}.ann p{margin-top:8px;white-space:pre-wrap}
.panel{background:var(--bg2);border:1px dashed var(--accent);border-radius:16px;padding:20px;margin:20px 0;display:grid;gap:10px}
.panel input,.panel textarea,.panel select,.modal input{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;outline:0}
.panel input:focus,.panel textarea:focus,.modal input:focus{border-color:var(--accent)}
.empty{color:var(--mute);padding:30px;text-align:center;border:1px dashed var(--line);border-radius:14px}
.modalbg{position:fixed;inset:0;background:#000b;z-index:100;display:none;place-items:center;padding:20px}
.modalbg.show{display:grid;animation:enter .25s}
.modal{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;width:min(400px,100%);display:grid;gap:12px}
.modal h2{margin:0}.err{color:var(--danger);font-size:.9rem;min-height:1.2em}
.link{background:none;border:0;color:var(--accent2);cursor:pointer;text-decoration:underline}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);background:var(--accent);padding:12px 22px;border-radius:12px;z-index:200;transition:.35s;font-weight:600}
.toast.show{transform:translate(-50%,0)}
footer{text-align:center;color:var(--mute);padding:30px}
@media(max-width:820px){header{flex-wrap:wrap;padding:10px 14px}nav{order:5;width:100%;overflow-x:auto}.search{width:auto;flex:1}nav span{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>
<header>
  <a class="logo" href="#/"><svg class="i" viewBox="0 0 24 24"><circle cx="8" cy="15" r="3.5"/><circle cx="16" cy="15" r="3.5"/><circle cx="12" cy="8.5" r="3.5"/><path d="M12 5c0-2 1-3 3-3"/></svg>BlackberryG</a>
  <nav id="nav"></nav>
  <div class="sp"></div>
  <div class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="q" placeholder="Search games and media" autocomplete="off"><div class="results" id="res"></div></div>
  <div id="auth"></div>
</header>
<main id="app"></main>
<footer>BlackberryG &copy; <span id="yr"></span></footer>
<div class="modalbg" id="mb"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
 
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, updateProfile, GoogleAuthProvider, signInWithPopup, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
 
const app = initializeApp({
  apiKey: "AIzaSyAPnc89xRnbYX7MzTgXoWhxytJTnjU7lFM",
  authDomain: "blackberrygs.firebaseapp.com",
  projectId: "blackberrygs",
  storageBucket: "blackberrygs.firebasestorage.app",
  messagingSenderId: "509411961845",
  appId: "1:509411961845:web:0ebac4880a6be4f9794ebc",
  measurementId: "G-C2J9TDRF6N"
});
try { import("https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js").then(m => m.getAnalytics(app)); } catch (e) {}
const auth = getAuth(app), db = getFirestore(app);
const ADMIN = "30copallock@pulaskischools.org";
 
/* Icons (Lucide-style SVG paths) */
const P = {
  home:'<path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/>',
  game:'<rect x="2" y="7" width="20" height="11" rx="4"/><path d="M6 12h4M8 10v4"/><circle cx="15" cy="11" r="1"/><circle cx="18" cy="13" r="1"/>',
  media:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  play:'<path d="m7 4 13 8-13 8z"/>',
  full:'<path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>',
  back:'<path d="m15 18-6-6 6-6"/>',
  ext:'<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
  mega:'<path d="M3 11v2a1 1 0 0 0 1 1h3l8 5V5L7 10H4a1 1 0 0 0-1 1zM19 8a5 5 0 0 1 0 8"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>'
};
const ic = n => `<svg class="i" viewBox="0 0 24 24">${P[n]}</svg>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2800); };
 
let user = null, games = [], media = [], anns = [];
const isAdmin = () => user && user.email === ADMIN && user.emailVerified;
 
/* Data */
const watch = (name, order, set) => onSnapshot(query(collection(db, name), orderBy(order, name === "games" ? "asc" : "desc")), s => { set(s.docs.map(d => ({ id: d.id, ...d.data() }))); render(); }, e => console.warn(name, e.message));
watch("games", "title", v => games = v);
watch("media", "createdAt", v => media = v);
watch("announcements", "createdAt", v => anns = v);
 
/* Auth UI */
onAuthStateChanged(auth, u => { user = u; renderAuth(); render(); });
function renderAuth() {
  const a = $("#auth");
  if (!user) { a.innerHTML = `<button class="btn" id="si">${ic("user")}Sign in</button>`; $("#si").onclick = () => authModal("in"); return; }
  const name = user.displayName || user.email.split("@")[0];
  a.innerHTML = `<div class="prof"><div class="avatar" id="av" tabindex="0">${user.photoURL ? `<img src="${esc(user.photoURL)}" alt="">` : esc(name[0].toUpperCase())}</div>
  <div class="menu" id="mn"><b>${esc(name)}</b><small>${esc(user.email)}</small>${isAdmin() ? `<div class="tag">Admin</div>` : ""}
  ${user.email === ADMIN && !user.emailVerified ? `<p style="color:var(--danger);font-size:.85rem;margin:6px 0">Verify your email to unlock admin tools.</p>` : ""}
  <button class="btn ghost" style="width:100%;margin-top:8px" id="so">${ic("out")}Sign out</button></div></div>`;
  $("#av").onclick = e => { e.stopPropagation(); $("#mn").classList.toggle("show"); };
  $("#so").onclick = () => signOut(auth);
}
document.addEventListener("click", e => { $("#mn")?.classList.remove("show"); if (!e.target.closest(".search")) $("#res").classList.remove("show"); });
 
function authModal(mode) {
  const up = mode === "up";
  $("#modal").innerHTML = `<h2>${up ? "Create account" : "Welcome back"}</h2>
  ${up ? `<input id="an" placeholder="Display name">` : ""}<input id="ae" type="email" placeholder="Email"><input id="ap" type="password" placeholder="Password">
  <div class="err" id="er"></div>
  <button class="btn" id="go">${up ? "Sign up" : "Sign in"}</button>
  <button class="btn ghost" id="gg">Continue with Google</button>
  <div style="text-align:center;color:var(--mute)">${up ? "Have an account?" : "New here?"} <button class="link" id="sw">${up ? "Sign in" : "Create account"}</button></div>`;
  $("#mb").classList.add("show");
  $("#mb").onclick = e => { if (e.target.id === "mb") $("#mb").classList.remove("show"); };
  const done = () => $("#mb").classList.remove("show");
  $("#sw").onclick = () => authModal(up ? "in" : "up");
  $("#gg").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).then(done).catch(e => $("#er").textContent = e.message);
  $("#go").onclick = async () => {
    const em = $("#ae").value.trim(), pw = $("#ap").value;
    try {
      if (up) { const c = await createUserWithEmailAndPassword(auth, em, pw); await updateProfile(c.user, { displayName: $("#an").value.trim() || em.split("@")[0] }); sendEmailVerification(c.user); toast("Account created. Check your email to verify it."); }
      else await signInWithEmailAndPassword(auth, em, pw);
      done();
    } catch (e) { $("#er").textContent = e.message.replace("Firebase: ", ""); }
  };
}
 
/* Helpers */
const ytId = u => { const m = String(u).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/); return m && m[1]; };
const gcard = g => `<a class="card" href="#/game/${g.id}"><div class="thumb" style="${g.thumb ? `background-image:url('${esc(g.thumb)}')` : ""}">${g.thumb ? "" : esc(g.title[0]?.toUpperCase())}<div class="play">${ic("play")}</div></div><div class="t"><b>${esc(g.title)}</b><small>${esc(g.category || "Game")}</small></div></a>`;
const mcard = m => `<div class="card" data-m="${m.id}">${isAdmin() ? `<button class="x" data-del="media/${m.id}" aria-label="Delete">${ic("trash")}</button>` : ""}<a href="#/media/${m.id}"><div class="thumb" style="background-image:url('https://i.ytimg.com/vi/${ytId(m.url)}/hqdefault.jpg')"><div class="play">${ic("play")}</div></div><div class="t"><b>${esc(m.title)}</b><small>Video</small></div></a></div>`;
const annHtml = a => `<div class="ann"><h3>${esc(a.title)}</h3><small>${a.createdAt?.toDate ? a.createdAt.toDate().toLocaleDateString(undefined, { dateStyle: "medium" }) : "Just now"}</small><p>${esc(a.body)}</p>${isAdmin() ? `<button class="btn sm red" style="margin-top:12px" data-del="announcements/${a.id}">${ic("trash")}Delete</button>` : ""}</div>`;
 
/* Views */
function render() {
  const [, route, id] = (location.hash || "#/").split("/");
  const r = route || "home";
  $("#nav").innerHTML = [["", "home", "Home"], ["games", "game", "Games"], ["media", "media", "Media"], ["info", "info", "Info & Updates"]]
    .map(([h, i, l]) => `<a href="#/${h}" class="${(r === "home" && !h) || r === h || (r === "game" && h === "games") ? "on" : ""}">${ic(i)}<span>${l}</span></a>`).join("");
  const el = $("#app"); let h = "";
  const key = location.hash + "|" + user?.uid;
  if (r === "home") h = home(); else if (r === "games") h = gamesView(); else if (r === "media") h = mediaView();
  else if (r === "info") h = infoView(); else if (r === "game") h = gameView(id); else if (r === "media" || r === "watch") h = "";
  if (r === "media" && id) h = watchView(id);
  const fresh = el.dataset.k !== location.hash;
  el.dataset.k = location.hash;
  el.innerHTML = `<div class="view" ${fresh ? "" : 'style="animation:none"'}>${h}</div>`;
  bind();
}
const home = () => `<section class="hero"><h1>Play more.<br>Stay purple.</h1><p>BlackberryG is a hand-picked library of browser games, videos and news, all in one place.</p><div class="row"><a class="btn" href="#/games">${ic("game")}Browse games</a><a class="btn ghost" href="#/info">${ic("mega")}Latest updates</a></div></section>
<h2>${ic("mega")}Latest announcement</h2>${anns[0] ? annHtml(anns[0]) : `<div class="empty">No announcements yet.</div>`}
<h2>${ic("game")}Recently added</h2>${games.length ? `<div class="grid">${[...games].reverse().slice(0, 8).map(gcard).join("")}</div>` : `<div class="empty">No games yet. ${isAdmin() ? "Add one from the Games page." : "Check back soon."}</div>`}`;
 
function gamesView() {
  const sorted = [...games].sort((a, b) => a.title.localeCompare(b.title)), g = {};
  sorted.forEach(x => { const L = /[a-z]/i.test(x.title[0]) ? x.title[0].toUpperCase() : "#"; (g[L] ||= []).push(x); });
  const ls = Object.keys(g);
  return `<h2 style="margin-top:0">${ic("game")}Games</h2>
  ${isAdmin() ? `<form class="panel" id="gf"><b>Add a game</b><input name="title" placeholder="Title" required><input name="url" type="url" placeholder="Game link (e.g. https://yourname.github.io/game/)" required><input name="thumb" type="url" placeholder="Thumbnail image link (optional)"><input name="category" placeholder="Category (optional)"><button class="btn">${ic("plus")}Add game</button></form>` : ""}
  ${ls.length ? `<div class="letters">${ls.map(l => `<a href="#" data-l="${l}">${l}</a>`).join("")}</div>${ls.map(l => `<div class="letter" id="L${l === "#" ? "n" : l}">${l}</div><div class="grid">${g[l].map(x => isAdmin() ? gcard(x).replace('<div class="thumb"', `<button class="x" data-del="games/${x.id}" aria-label="Delete">${ic("trash")}</button><div class="thumb"`) : gcard(x)).join("")}</div>`).join("")}` : `<div class="empty">No games added yet.</div>`}`;
}
function gameView(id) {
  const g = games.find(x => x.id === id);
  if (!g) return `<div class="empty">Game not found. <a class="link" href="#/games">Back to games</a></div>`;
  return `<div class="bar"><a class="btn ghost sm" href="#/games">${ic("back")}Games</a><h1>${esc(g.title)}</h1><a class="btn ghost sm" target="_blank" rel="noopener" href="${esc(g.url)}">${ic("ext")}New tab</a><button class="btn sm" id="fs">${ic("full")}Fullscreen</button></div>
  <div class="player" id="pl"><iframe src="${esc(g.url)}" allow="fullscreen; autoplay; gamepad; clipboard-write" allowfullscreen title="${esc(g.title)}"></iframe></div>`;
}
function mediaView() {
  return `<h2 style="margin-top:0">${ic("media")}Media</h2>
  ${isAdmin() ? `<form class="panel" id="mf"><b>Add a video</b><input name="title" placeholder="Title" required><input name="url" type="url" placeholder="YouTube link" required><button class="btn">${ic("plus")}Add video</button></form>` : ""}
  ${media.length ? `<div class="grid">${media.map(mcard).join("")}</div>` : `<div class="empty">No videos yet.</div>`}`;
}
function watchView(id) {
  const m = media.find(x => x.id === id); if (!m) return `<div class="empty">Video not found. <a class="link" href="#/media">Back to media</a></div>`;
  return `<div class="bar"><a class="btn ghost sm" href="#/media">${ic("back")}Media</a><h1>${esc(m.title)}</h1><button class="btn sm" id="fs">${ic("full")}Fullscreen</button></div>
  <div class="player" id="pl"><iframe src="https://www.youtube.com/embed/${ytId(m.url)}" allow="fullscreen; autoplay; encrypted-media" allowfullscreen title="${esc(m.title)}"></iframe></div>`;
}
function infoView() {
  return `<h2 style="margin-top:0">${ic("info")}Info & updates</h2>
  <div class="ann"><h3>About BlackberryG</h3><p>BlackberryG collects browser games and videos in one fast, ad-light place. Create a free account to get a profile, and check back here for news from the admin.</p></div>
  ${isAdmin() ? `<form class="panel" id="af"><b>Send an announcement</b><input name="title" placeholder="Title" required><textarea name="body" rows="4" placeholder="What's new?" required></textarea><button class="btn">${ic("mega")}Publish announcement</button></form>` : ""}
  <h2>${ic("mega")}Announcements</h2>${anns.length ? anns.map(annHtml).join("") : `<div class="empty">No announcements yet.</div>`}`;
}
 
/* Bindings */
function bind() {
  $("#fs")?.addEventListener("click", () => $("#pl").requestFullscreen?.());
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async e => { e.preventDefault(); e.stopPropagation(); if (confirm("Delete this?")) { const [c, i] = b.dataset.del.split("/"); try { await deleteDoc(doc(db, c, i)); toast("Deleted"); } catch (er) { toast("Permission denied"); } } });
  document.querySelectorAll("[data-l]").forEach(a => a.onclick = e => { e.preventDefault(); document.getElementById("L" + (a.dataset.l === "#" ? "n" : a.dataset.l))?.scrollIntoView({ behavior: "smooth" }); });
  const submit = (id, col, fn) => { const f = $(id); if (f) f.onsubmit = async e => { e.preventDefault(); const d = Object.fromEntries(new FormData(f)); const x = fn(d); if (!x) return; try { await addDoc(collection(db, col), { ...x, createdAt: serverTimestamp(), by: user.email }); f.reset(); toast("Published"); } catch (er) { toast("Permission denied"); } }; };
  submit("#gf", "games", d => d);
  submit("#af", "announcements", d => d);
  submit("#mf", "media", d => ytId(d.url) ? d : (toast("Enter a valid YouTube link"), null));
}
 
/* Search */
$("#q").addEventListener("input", e => {
  const v = e.target.value.trim().toLowerCase(), r = $("#res");
  if (!v) return r.classList.remove("show");
  const hits = [...games.filter(g => g.title.toLowerCase().includes(v)).map(g => ({ t: g.title, h: "#/game/" + g.id, k: "game" })), ...media.filter(m => m.title.toLowerCase().includes(v)).map(m => ({ t: m.title, h: "#/media/" + m.id, k: "media" }))].slice(0, 8);
  r.innerHTML = hits.length ? hits.map(x => `<a href="${x.h}">${ic(x.k)}<span>${esc(x.t)}</span><small>${x.k}</small></a>`).join("") : `<a style="color:var(--mute)">No results</a>`;
  r.classList.add("show");
});
$("#res").addEventListener("click", () => { $("#res").classList.remove("show"); $("#q").value = ""; });
$("#yr").textContent = new Date().getFullYear();
window.addEventListener("hashchange", () => { render(); scrollTo(0, 0); });
renderAuth(); render();
</script>
</body>
</html>
